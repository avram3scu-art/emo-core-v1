name: CI

on:
  push:
    branches:
      - emo-2026-10
      - main
      - master
      - feature/dac-mode-and-snapshot-query-params
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          # Pinned environment (audit D8, session 2.1): exact versions, then the package without deps.
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps ".[dev]"
          pip check

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.txt

      # Readable without log access (FIX_PLAN F4): one error annotation per failing test
      # with its first error line (pytest's short summary), and the summary line as a notice.
      - name: Test results as annotations
        if: always()
        run: |
          [ -f pytest.txt ] || exit 0
          grep -E '^(FAILED|ERROR) ' pytest.txt | head -20 | while IFS= read -r l; do
            echo "::error title=pytest::${l//%/%25}"
          done
          s=$(grep -E '[0-9]+ (passed|failed|error|errors|skipped)' pytest.txt | tail -1)
          echo "::notice title=pytest summary::${s:-no summary line (pytest did not finish)}"

      - name: Type check (mypy)
        env:
          PYTHONPATH: .
        # Errors are also emitted as annotations, readable without log access.
        run: |
          set -o pipefail
          mypy emo | sed -E 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/'

      - name: Lint (ruff)
        run: |
          ruff check --output-format github .

      - name: Bug check of analysis/ (pyflakes rules only; no reformatting of frozen scripts)
        run: |
          ruff check --isolated --select F --target-version py311 --output-format github analysis

      # F2 (28 Oct 2026): every claim word listed in scripts/claims_grep.py
      # in the repository must have a justification; an unjustified hit fails CI and is shown as an annotation.
      - name: Claim-word check
        run: |
          set -o pipefail
          python scripts/claims_grep.py | tee claims.txt || { grep '| UNJUSTIFIED |' claims.txt | head -20 | while IFS= read -r l; do echo "::error title=unjustified claim::${l//%/%25}"; done; exit 1; }


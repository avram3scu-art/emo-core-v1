name: Mirror daily

# Session 3.4 (docs/LOOP_CARD_PROTOCOL.md §11). After each Stream daily run (and a daily
# backup), decrypts the stream log inside this Action, builds every card with
# emo/stream/cards.py and commits only data/mirror/aggregates.json: safe_aggregate,
# edge-rule counts, source-days lost and the run time. No per-event card leaves the Action
# until GDACS and IFRC GO reuse terms are recorded. Then rebuilds and deploys the public
# page (index + mirror.html). The script prints nothing about records (public logs).
on:
  workflow_run:
    workflows: ["Stream daily"]
    types: [completed]
  schedule:
    - cron: "23 13 * * *"   # backup, after the 11:47 UTC stream backup
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stream-commit
  cancel-in-progress: false

jobs:
  cards:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      ok: ${{ steps.commit.outputs.ok }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: "emo-2026-10"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: "pip", cache-dependency-path: requirements-lock.txt}
      - run: pip install -r requirements-lock.txt
      - name: Build cards, write aggregates only
        env:
          EMO_STREAM_KEY: ${{ secrets.EMO_STREAM_KEY }}
          PYTHONPATH: .
        run: python scripts/stream_cards.py cards
      - name: Commit only the aggregates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mirror/aggregates.json
          [ -z "$(git status --porcelain --untracked-files=no | grep -v '^[MA]  data/mirror/aggregates.json$')" ] || { echo "::error::unexpected change"; exit 1; }
          git commit -m "Mirror aggregates (run ${{ github.run_id }})"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin emo-2026-10 && git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ] && echo "ok=true" >> "$GITHUB_OUTPUT"
          [ "$ok" = "1" ]

  pages:
    needs: cards
    if: needs.cards.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: "emo-2026-10"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Build page
        run: python scripts/build_site.py --out site
      - uses: actions/configure-pages@v6
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v5
        with: {path: site, include-hidden-files: true}
      - name: Deploy page
        id: deploy
        uses: actions/deploy-pages@v5

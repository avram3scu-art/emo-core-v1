name: Weekly refresh

# Once a week (and on manual run): download the OWID series (annual CO2,
# ozone-depleting substances, foreign aid share, armed-conflict deaths) and the
# OpenAlex co-authorship counts (incl. the series excluding CN and ID), each into
# its own folder under data/sources/, with source URL and download date in
# data/MANIFEST.json; rerun the analysis scripts, check the frozen RDL records,
# run the unit tests. Changed data and figures are committed with a dated message
# ONLY if the tests pass (scripts/weekly_run.py decides; see commit_allowed).
#
# Optional settings (repository Settings -> Secrets and variables -> Actions):
#   secret   OPENALEX_API_KEY  own OpenAlex budget instead of the shared free one
#   variable OPENALEX_MAILTO   contact address sent to OpenAlex

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      committed_ok: ${{ steps.run.outputs.commit_allowed }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Branch head, not the triggering commit: a queued run must start from
          # the previous run's commit, or both write the same files and the push
          # conflicts (seen on 23 Oct 2026, run 39916346571).
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" matplotlib

      - name: Weekly run (download, analyses, tests)
        id: run
        continue-on-error: true
        env:
          PYTHONPATH: .
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python scripts/weekly_run.py

      - name: Publish summary
        if: always()
        run: |
          f=$(ls -d results/weekly/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$f" ]; then cat "$f/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep results of a blocked run
        if: steps.run.outputs.commit_allowed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-not-committed
          path: results/weekly/
          retention-days: 90

      - name: Commit changed data and figures (only if tests pass)
        if: steps.run.outputs.commit_allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results analysis/*.png
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          note=$([ "${{ steps.run.outputs.ok }}" = "true" ] && echo "all checks passed" || echo "tests passed; some downloads failed, see SUMMARY.md")
          git commit -m "Weekly run $day: $note"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if the run found problems
        if: steps.run.outcome != 'success'
        run: |
          echo "The weekly run reported problems; see the summary above."
          exit 1

  # Public page: rebuilt and published only after a successful run (the refresh
  # job fails, and this job is skipped, whenever the run found problems).
  pages:
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.committed_ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (branch head, including this run's commit)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build page
        run: python scripts/build_site.py --out site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy page
        id: deploy
        uses: actions/deploy-pages@v4

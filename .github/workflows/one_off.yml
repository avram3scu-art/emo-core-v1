name: One-off analyses (manual)

# Reproduces the one-off runs of session 7 (docs/SMF_PROTOCOL.md §7-§12) and session 8
# (docs/SYNERGY_PROTOCOL.md), and the NHC PDF check. Session-7 layout probes were deleted
# on 26 Oct 2026 (git history). These replace ten single-purpose workflow files (probe_*.yml, smf_*.yml),
# whose recorded runs are listed in docs/SMF_PROTOCOL.md; the old files remain in git history.
# Re-running refetches current data vintages, so results can differ from the record.
# Nothing is committed unless `commit` is set; the recorded results are never overwritten
# by default.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which analysis
        required: true
        type: choice
        options: [smf-co2-lead12, smf-co2-leads, smf-co2-lead18, smf-elec, smf-spf, smf-ip, synergy-climate, nhc-pdf, gwi-v2-sources]
      commit:
        description: Commit the refetched data and result (overwrites the recorded files)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -r requirements-lock.txt   # pinned (audit D8, session 2.1)
      - name: Run
        env: {PYTHONPATH: ".", JOB: "${{ inputs.job }}"}
        run: |
          case "$JOB" in
            smf-co2-lead12) f=fetch_steo_smf; a=smf_steo; r=smf_steo; paths="data/sources/eia_steo_co2 data/sources/eia_mer_t11_01 data/sources/eia_smf_SOURCES.json" ;;
            smf-co2-leads)  f=fetch_steo_smf_leads; a=smf_steo_leads; r=smf_steo_leads; paths="data/sources/eia_steo_co2_leads" ;;
            smf-co2-lead18) f=fetch_steo_smf_h18; a=smf_steo_h18; r=smf_steo_h18; paths="data/sources/eia_steo_co2_h18 data/sources/eia_steo_co2_leads" ;;
            smf-elec)   f=fetch_steo_smf_elec; a=smf_steo_elec; r=smf_steo_elec; paths="data/sources/eia_steo_elec" ;;
            smf-spf)    f=fetch_spf_smf; a=smf_spf; r=smf_spf; paths="data/sources/spf_unemp" ;;
            smf-ip)     f=fetch_ip_smf; a=smf_ip; r=smf_ip; paths="data/sources/smf_ip" ;;
            nhc-pdf)    pip install -q pdfplumber; mkdir -p results/nhc_check
                        code=$(curl -sSL -A "Mozilla/5.0 (emo-core-v1 audit)" -o nhc.pdf -w "%{http_code}" "https://www.nhc.noaa.gov/verification/pdfs/1970-present_OFCL_ATL_annual_trk_errors_noTDs.pdf" 2>&1 || true)
                        echo "::notice title=nhc-download::HTTP $code; $(file nhc.pdf 2>&1 | cut -c1-200)"
                        sha256sum nhc.pdf > results/nhc_check/pdf.sha256; python -c "import pdfplumber,sys; p=pdfplumber.open('nhc.pdf'); open('results/nhc_check/nhc_pdf.txt','w').write(chr(12).join(pg.extract_text(layout=True) or '' for pg in p.pages))"
                        head -c 3000 results/nhc_check/nhc_pdf.txt > out.txt; echo "paths=results/nhc_check" >> "$GITHUB_ENV"; paths="" ;;
            gwi-v2-sources) python scripts/check_gwi_v2_sources.py > out.txt 2>&1 || true; cat out.txt; paths="" ;;
            synergy-climate) f=fetch_synergy_climate; a=synergy_climate; r=synergy_climate; paths="data/sources/synergy_climate" ;;
          esac
          if [ -n "$paths" ]; then
            python scripts/$f.py > fetch.txt 2>&1 || true
            mkdir -p results/$r
            python analysis/$a.py > results/$r/result.txt 2>&1 || true
            cp fetch.txt results/$r/fetch.txt
            cp results/$r/result.txt out.txt
            echo "paths=$paths results/$r" >> "$GITHUB_ENV"
          fi
          echo "::notice title=$JOB::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out.txt | cut -c1-6000)"
      - name: Commit (only if asked)
        if: inputs.commit && env.paths != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "One-off rerun ${{ inputs.job }}: data and result" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Weekly open-data refresh

# Refreshes the open data in data/ (OWID CO2, ozone-depleting substances, aid,
# conflict; OpenAlex co-authorship counts), reruns the analyses, checks the
# frozen RDL records and the forecast ledger hash, runs the tests, and commits
# a dated record to results/weekly/<date>/. See scripts/weekly_run.py.
#
# Optional settings (repository Settings -> Secrets and variables -> Actions):
#   secret   OPENALEX_API_KEY  own OpenAlex budget instead of the shared free one
#   variable OPENALEX_MAILTO   contact address sent to OpenAlex

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC (07:23 Brussels summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/weekly-refresh.yml
      - scripts/refresh_open_data.py
      - scripts/weekly_run.py

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" matplotlib

      - name: Weekly run
        id: run
        continue-on-error: true
        env:
          PYTHONPATH: .
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python scripts/weekly_run.py

      - name: Publish summary
        if: always()
        run: |
          f=$(ls -d results/weekly/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$f" ]; then cat "$f/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit dated results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results analysis/*.png
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          result=$([ "${{ steps.run.outcome }}" = "success" ] && echo "all checks passed" || echo "problems, see SUMMARY.md")
          git commit -m "Weekly run $day: $result"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if the run found problems
        if: steps.run.outcome != 'success'
        run: |
          echo "The weekly run reported problems; see results/weekly/*/SUMMARY.md"
          exit 1

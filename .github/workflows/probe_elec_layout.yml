name: Layout probe electricity (no data values)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install pandas openpyxl xlrd
      - run: python scripts/probe_steo_elec_layout.py jan10_base.xls jan20_base.xlsx oct26_base.xlsx > probe.txt 2>/dev/null || true
      - run: echo "::notice title=probe::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' probe.txt | cut -c1-60000)"

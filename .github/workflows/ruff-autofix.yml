name: Ruff Auto Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff auto-fix
        run: |
          echo "::notice title=before::$(ruff check . --statistics 2>&1 | tail -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
          ruff check . --fix || true
          echo "::notice title=remaining::$(ruff check . --output-format=concise 2>&1 | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply Ruff auto-fixes"
            git push origin HEAD:${{ github.ref_name }}
          fi

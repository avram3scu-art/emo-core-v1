name: Synergy fetch resume (session 8)

# docs/SYNERGY_PROTOCOL.md §9 amendment: resume the OpenAlex fetch daily until all 120
# months are cached, then run the pre-registered analysis once. Does nothing after a
# result exists (results/synergy_climate/result.txt contains "VERDICT").
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: emo-2026-10}
      - name: Stop if already done
        id: gate
        run: |
          if grep -q "VERDICT" results/synergy_climate/result.txt 2>/dev/null; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.done != '1'
        with: {python-version: "3.11"}
      - if: steps.gate.outputs.done != '1'
        run: pip install numpy pandas
      - name: Fetch, and analyse only when complete
        if: steps.gate.outputs.done != '1'
        env: {PYTHONPATH: "."}
        run: |
          mkdir -p results/synergy_climate
          python scripts/fetch_synergy_climate.py > results/synergy_climate/fetch.txt 2>&1 || true
          if [ -f data/sources/synergy_climate/SOURCES.json ]; then
            python analysis/synergy_climate.py > results/synergy_climate/result.txt 2>&1 || true
          fi
          echo "::notice title=synergy::$(tail -1 results/synergy_climate/fetch.txt)"
      - name: Commit
        if: steps.gate.outputs.done != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/synergy_climate results/synergy_climate
          git commit -m "Synergy resume: fetch progress or result" || exit 0
          git pull --rebase origin emo-2026-10
          git push origin HEAD:emo-2026-10

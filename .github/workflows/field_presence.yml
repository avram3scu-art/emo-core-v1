name: Field presence

# Session 3.4 (docs/FIELD_PRESENCE_CHECK.md; docs/LOOP_CARD_PROTOCOL.md §10, deadline
# 30 Nov 2026). Decrypts the stream log inside this Action and commits only
# data/mirror/field_presence.json: per source and field, the share of records where the key
# is present and parses (rounded down to 0.05; groups of >= 20 only) and schema key names.
# No values, identifiers, dates or record counts; EU27 CEMS records are never read. The
# script prints nothing about records (this repository's Action logs are public).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stream-commit
  cancel-in-progress: false

jobs:
  presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: "pip", cache-dependency-path: requirements-lock.txt}
      - run: pip install -r requirements-lock.txt
      - name: Field-presence aggregate
        env:
          EMO_STREAM_KEY: ${{ secrets.EMO_STREAM_KEY }}
          PYTHONPATH: .
        run: python scripts/stream_cards.py presence
      - name: Commit only the aggregate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mirror/field_presence.json
          [ -z "$(git status --porcelain --untracked-files=no | grep -v '^[MA]  data/mirror/field_presence.json$')" ] || { echo "::error::unexpected change"; exit 1; }
          git commit -m "Field-presence aggregate (run ${{ github.run_id }})"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = "1" ]

name: One-off wiki title check

# Metadata check for docs/GWI_CALIBRATION_PROTOCOL.md §8 (was "Mitochondrion" moved?). Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Wikipedia and Wikimedia APIs
        run: |
          UA="emo-core-v1 title check (github.com/avram3scu-art/emo-core-v1)"
          q() { curl -sS -A "$UA" "$1" | tr -d '\n' | sed 's/%/%25/g' | cut -c1-3000; }
          echo "::notice title=info Mitochondrion (no redirect follow)::$(q 'https://en.wikipedia.org/w/api.php?action=query&prop=info&format=json&formatversion=2&titles=Mitochondrion')"
          echo "::notice title=info Mitochondria::$(q 'https://en.wikipedia.org/w/api.php?action=query&prop=info&format=json&formatversion=2&titles=Mitochondria')"
          echo "::notice title=move log Mitochondrion::$(q 'https://en.wikipedia.org/w/api.php?action=query&list=logevents&letype=move&letitle=Mitochondrion&format=json&formatversion=2')"
          echo "::notice title=move log Mitochondria::$(q 'https://en.wikipedia.org/w/api.php?action=query&list=logevents&letype=move&letitle=Mitochondria&format=json&formatversion=2')"
          for t in Mitochondrion Mitochondria; do
            echo "::notice title=daily views $t 2026-07-01..07-20::$(curl -sS -A "$UA" "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/$t/daily/20260701/20260720" | python3 -c 'import json,sys;print(" ".join(f"{i[\"timestamp\"][4:8]}:{i[\"views\"]}" for i in json.load(sys.stdin).get("items",[])))')"
          done

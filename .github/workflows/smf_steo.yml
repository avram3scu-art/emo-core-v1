name: SMF test on EIA STEO (run once, docs/SMF_PROTOCOL.md)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  smf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install numpy pandas openpyxl xlrd
      - name: Fetch
        run: python scripts/fetch_steo_smf.py > fetch.txt 2>&1; tail -3 fetch.txt
      - name: Run
        env: {PYTHONPATH: .}
        run: |
          mkdir -p results/smf_steo
          python analysis/smf_steo.py > results/smf_steo/result.txt 2>&1 || true
          cp fetch.txt results/smf_steo/fetch.txt
          echo "::notice title=smf::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' results/smf_steo/result.txt | cut -c1-6000)"
      - name: Commit data and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/eia_steo_co2 data/sources/eia_mer_t11_01 data/sources/eia_smf_SOURCES.json results/smf_steo
          git commit -m "SMF STEO test: data and result (single run)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
